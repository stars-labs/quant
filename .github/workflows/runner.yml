name: Self-hosted runner
on:
  push:
    paths: ['runner/**', 'scripts/import_htx_journal.py', 'migrations/04*.sql', '.github/workflows/runner.yml']
  pull_request:
    paths: ['runner/**', 'scripts/import_htx_journal.py', 'migrations/04*.sql', '.github/workflows/runner.yml']
permissions:
  contents: read
jobs:
  accounting-and-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: starslab_runner_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ./runner psycopg2-binary
      - run: python -m unittest discover -s runner/tests -v
        env:
          RUNNER_TEST_DSN: host=127.0.0.1 dbname=starslab_runner_test user=postgres
      - run: sh -n runner/install.sh
